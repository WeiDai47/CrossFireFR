<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Content | Crossfire Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #b11111; --accent-green: #0bea00; --text-light: #f8fafc; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-light); padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; margin-bottom: 40px; border: 1px solid var(--border); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #0f172a; font-family: 'Oswald'; text-transform: uppercase; color: var(--accent-green); }
        .btn-edit { color: var(--accent-green); text-decoration: none; margin-right: 15px; font-weight: bold; }
        .btn-delete { color: var(--accent-red); text-decoration: none; font-weight: bold; cursor: pointer; }
        h2 { font-family: 'Oswald'; text-transform: uppercase; border-left: 4px solid var(--accent-red); padding-left: 15px; }
    </style>
</head>
<body>
<div class="container">
    <a href="/admin/dashboard" style="color: #94a3b8; text-decoration: none;">← Back to Dashboard</a>

    <h2>Manage Rodeo Events</h2>
    <table>
        <thead>
        <tr>
            <th>Event Name</th>
            <th>Location</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.eventName}">Name</td>
            <td th:text="${event.location}">Location</td>
            <td th:text="${event.eventDate}">Date</td>
            <td>
                <a href="javascript:void(0)" class="btn-delete"
                   th:onclick="'handleDelete(\'/admin/event/delete/' + ${event.id} + '\', \'Rodeo\')'">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <h2>Manage Fantasy Contests</h2>
    <table>
        <thead>
        <tr>
            <th>Contest Name</th>
            <th>Rodeo</th>
            <th>Fee</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="contest : ${contests}">
            <td th:text="${contest.contestName}">Name</td>
            <td th:text="${contest.rodeoEvent != null ? contest.rodeoEvent.eventName : 'No Rodeo'}">Rodeo</td>
            <td th:text="'$' + ${contest.entryFee}">$0</td>
            <td>
                <a th:href="@{/admin/contest/{id}/setup(id=${contest.id})}" class="btn-edit">Edit Roster</a>
                <a href="javascript:void(0)" class="btn-delete"
                   th:onclick="'handleDelete(\'/admin/contest/delete/' + ${contest.id} + '\', \'Contest\')'">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function handleDelete(url, type) {
        // Step 1: Confirm basic deletion
        if (confirm("Are you sure you want to delete this " + type + "?")) {

            // Step 2: Ask about refunds
            let issueRefund = confirm("Would you like to REFUND the entry fees to all participants before deleting?");

            if (issueRefund) {
                window.location.href = url + "?refund=true";
            } else {
                window.location.href = url + "?refund=false";
            }
        }
    }
</script>
</body>
</html>
