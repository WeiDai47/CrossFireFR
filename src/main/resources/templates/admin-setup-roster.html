<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Contest Roster | Crossfire</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #b11111; --accent-green: #0bea00; --text-light: #f8fafc; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-light); padding: 40px; }
        .setup-container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        .athlete-list { height: 300px; overflow-y: auto; background: #0f172a; padding: 15px; border-radius: 6px; margin-top: 10px; }
        .athlete-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1e293b; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent-green); text-transform: uppercase; font-size: 0.8rem; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 4px; }
        .btn-add { background: var(--accent-red); color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-family: 'Oswald'; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="setup-container">
    <h1 th:text="'Setup Roster: ' + ${contest.contestName}" style="font-family: 'Oswald'; color: white;">Setup</h1>

    <form th:action="@{/admin/contest/setup/save}" method="post">
        <input type="hidden" name="contestId" th:value="${contest.id}">

        <div class="form-group">
            <label>Category Name (Event Type)</label>
            <input type="text" name="categoryName" placeholder="e.g. Bull Riding" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Slots Available (Total lines in draft)</label>
                <input type="number" name="slotsAvailable" value="1" required>
            </div>
            <div class="form-group">
                <label>Max Picks per User (How many can they pick?)</label>
                <input type="number" name="maxPickPerUser" value="1" required>
            </div>
        </div>

        <label>Select Eligible Athletes for this Category</label>
        <div class="athlete-list">
            <div th:each="athlete : ${allAthletes}" class="athlete-item">
                <input type="checkbox" name="athleteIds" th:value="${athlete.id}">
                <span th:text="${athlete.name} + ' (' + ${athlete.eventType} + ')'">Name</span>
                <span style="margin-left: auto; color: var(--accent-green);" th:text="'$' + ${athlete.salary}">$0</span>
            </div>
        </div>

        <button type="submit" class="btn-add">Add Category to Contest</button>
    </form>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid var(--border);">

    <h3 style="font-family: 'Oswald';">Existing Setup</h3>
    <div th:each="setup : ${contest.contestSetups}" style="margin-bottom: 10px; padding: 10px; background: #0f172a; border-radius: 5px;">
        <span th:text="${setup.categoryName} + ': User picks ' + ${setup.maxPickPerUser}">Category</span>
    </div>
</div>
</body>
</html>
