<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Crossfire Rodeo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #b11111; --accent-green: #0bea00; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h1 { font-family: 'Oswald'; color: var(--accent-red); text-transform: uppercase; margin-bottom: 30px; }
        label { display: block; text-align: left; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: var(--accent-green); border: none; font-family: 'Oswald'; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; color: black; }
        .error-msg { color: #ff4444; font-size: 0.85rem; margin-bottom: 20px; background: rgba(255, 68, 68, 0.1); padding: 10px; border-radius: 4px; border: 1px solid #ff4444; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Crossfire Login</h1>

    <div th:if="${param.error != null and param.error[0] == 'InvalidCredentials'}" class="error-msg">
        Incorrect password. Please try again.
    </div>
    <div th:if="${param.error != null and param.error[0] == 'UserNotFound'}" class="error-msg">
        Username not found.
    </div>

    <form th:action="@{/login}" method="post">
        <label>Username</label>
        <input type="text" name="username" placeholder="e.g. RodeoKing" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>

        <button type="submit" class="btn-login">Sign In</button>
    </form>
</div>
</body>
</html>
