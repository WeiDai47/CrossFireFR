<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Select Event | Crossfire</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #b11111; --accent-green: #0bea00; --text-light: #f8fafc; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-light); padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-family: 'Oswald', sans-serif; text-transform: uppercase; color: var(--accent-red); border-bottom: 2px solid var(--accent-green); padding-bottom: 10px; }
        .event-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: white; transition: 0.2s; }
        .event-card:hover { border-color: var(--accent-green); transform: scale(1.01); }
        .btn-add { background: var(--accent-green); color: black; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-family: 'Oswald'; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Scoring Dashboard</h1>
        <a href="/admin/add" class="btn-add">+ ADD CONTESTANT</a>
    </div>
    <p style="color: #94a3b8;">Select a Rodeo to enter live scores:</p>

    <div th:each="event : ${events}">
        <a th:href="@{/admin/scoring/{id}(id=${event.id})}" class="event-card">
            <div>
                <strong style="font-size: 1.2rem; display: block;" th:text="${event.eventName}">NFR Round 1</strong>
                <span style="color: #94a3b8;" th:text="${event.location}">Las Vegas, NV</span>
            </div>
            <span style="color: var(--accent-green); font-family: 'Oswald';">ENTER SCORES →</span>
        </a>
    </div>
</div>
</body>
</html>
