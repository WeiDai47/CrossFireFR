<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lobby | Crossfire Rodeo Fantasy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-red: #b11111;
            --accent-green: #0bea00;
            --text-light: #f8fafc;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 40px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .logo { font-family: 'Oswald', sans-serif; font-size: 1.8rem; color: var(--accent-red); text-transform: uppercase; }

        .search-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 4px solid var(--accent-red);
        }

        .contest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .contest-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .contest-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-green);
        }

        .entry-fee-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent-red);
            padding: 5px 12px;
            border-radius: 20px;
            font-family: 'Oswald';
            font-size: 0.9rem;
        }

        .btn-draft {
            display: block;
            margin-top: 20px;
            padding: 12px;
            background: var(--accent-green);
            color: #000;
            text-align: center;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-weight: bold;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .contest-meta { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <div class="logo">Crossfire <span style="color:white">Rodeo</span></div>
        <div class="nav-links">
            <a href="/draft/my-teams" style="color: var(--accent-green)">My Teams</a>
            <a href="/admin/add">Add Contestant</a>
        </div>
    </nav>

    <div class="search-container">
        <h2 style="font-family: 'Oswald'; margin-top: 0;">FIND YOUR ENTRIES</h2>
        <form th:action="@{/draft/my-teams}" method="get" style="display: flex; justify-content: center; gap: 10px;">
            <input type="text" name="username" placeholder="Draft Username..." required style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-dark); color: white; width: 250px;"/>
            <button type="submit" style="background: var(--accent-red); color: white; border: none; padding: 10px 20px; font-family: 'Oswald'; cursor: pointer; border-radius: 6px;">SEARCH</button>
        </form>
    </div>

    <h1 style="font-family: 'Oswald', sans-serif; text-transform: uppercase;">Available Contests</h1>

    <div class="contest-grid">
        <div th:each="contest : ${contests}" class="contest-card">
            <div class="entry-fee-badge" th:text="${contest.entryFee == T(java.math.BigDecimal).ZERO} ? 'FREE' : '$' + ${contest.entryFee}">$10</div>

            <h2 th:text="${contest.contestName}" style="margin: 0 0 5px 0; color: var(--accent-green); font-family: 'Oswald';">Contest Name</h2>

            <div class="contest-meta">
                <span th:text="${contest.rodeoEvent.eventName}">Rodeo Event Name</span><br/>
                📍 <span th:text="${contest.rodeoEvent.location}">Location</span>
            </div>

            <p><strong>Prize Pool:</strong> <span style="color: var(--accent-green)" th:text="'$' + ${#numbers.formatDecimal(contest.prizePool, 0, 'COMMA', 0, 'POINT')}">$1,000</span></p>
            <p><strong>Salary Cap:</strong> $<span th:text="${#numbers.formatDecimal(contest.salaryCap, 0, 'COMMA', 0, 'POINT')}">50,000</span></p>
            <p><strong>Date:</strong> <span th:text="${contest.rodeoEvent.eventDate}">2025-12-04</span></p>

            <a th:href="@{'/draft/' + ${contest.id}}" class="btn-draft">Enter Draft Room</a>
        </div>
    </div>
</div>

</body>
</html>
