<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Funds | Crossfire Rodeo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-green: #0bea00; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .deposit-card { background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; border-top: 4px solid var(--accent-green); }
        h1 { font-family: 'Oswald'; text-transform: uppercase; margin-bottom: 10px; }
        .current-balance { color: var(--accent-green); font-weight: bold; margin-bottom: 30px; font-size: 1.2rem; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; font-size: 1.1rem; }
        .btn-submit { width: 100%; padding: 15px; background: var(--accent-green); border: none; font-family: 'Oswald'; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; color: black; font-size: 1.1rem; }
        .back-link { display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="deposit-card">
    <h1>Add Funds</h1>
    <p class="current-balance">Current Balance: $<span th:text="${user.balance}">0.00</span></p>

    <form th:action="@{/account/add-funds}" method="post">
        <input type="hidden" name="username" th:value="${user.username}">

        <label style="display:block; text-align:left; font-size:0.8rem; margin-bottom:5px; color:#94a3b8;">DEPOSIT AMOUNT ($)</label>
        <input type="number" name="amount" step="0.01" min="1" placeholder="0.00" autofocus required>

        <button type="submit" class="btn-submit">Confirm Deposit</button>
    </form>

    <a th:href="@{/(username=${user.username})}" class="back-link">← Cancel and Return to Lobby</a>
</div>
</body>
</html>
