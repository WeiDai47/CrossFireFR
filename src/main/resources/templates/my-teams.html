<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Teams - Crossfire Rodeo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-red: #b11111;
      --accent-green: #0bea00;
      --text-light: #f8fafc;
      --border: #334155;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding: 40px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    h1 { font-family: 'Oswald', sans-serif; text-transform: uppercase; color: var(--accent-red); margin-bottom: 5px;}

    .team-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      position: relative;
      border-left: 4px solid var(--accent-red);
    }

    .contest-info {
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .athlete-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .athlete-item {
      padding: 10px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
    }

    .athlete-item span {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .athlete-item strong {
      color: var(--text-light);
      font-size: 1rem;
    }

    .btn-back {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent-green);
      text-decoration: none;
      font-weight: bold;
    }

    .rank-box {
      text-align: center;
      min-width: 80px;
      padding: 5px;
      border-radius: 8px;
      background: #0f172a;
    }
  </style>
</head>
<body>

<div class="container">
  <a th:href="@{/(username=${searchedUsername})}" class="btn-back">← Back to Lobby</a>

  <h1>My Drafted Teams</h1>
  <p style="margin-bottom: 30px; color: #94a3b8;">Viewing entries for: <strong th:text="${searchedUsername}" style="color: var(--accent-green);">Username</strong></p>

  <div th:if="${#lists.isEmpty(entries)}">
    <div class="team-card" style="text-align: center; padding: 50px;">
      <p style="font-size: 1.2rem; color: #94a3b8;">No teams found for this user.</p>
      <a href="/" style="color: var(--accent-green); text-decoration: none;">Go to the Lobby to enter a contest!</a>
    </div>
  </div>

  <div th:each="entry : ${entries}" class="team-card">
    <div class="contest-info" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2 th:text="${entry.fantasyContest.contestName}" style="margin:0; font-family: 'Oswald'; color: var(--text-light); font-size: 1.5rem;">Contest Name</h2>
        <div style="margin-top: 5px;">
          <span style="color: var(--accent-green); font-weight: 600;" th:text="${entry.fantasyContest.rodeoEvent.eventName}">Rodeo Event</span>
          <span style="margin-left: 15px; color: #94a3b8; font-size: 0.9rem;" th:text="'Salary Used: $' + ${#numbers.formatDecimal(entry.totalTeamSalary, 0, 'COMMA', 0, 'POINT')}"></span>
        </div>
      </div>

      <div style="text-align: right; display: flex; align-items: center; gap: 20px;">
        <div class="rank-box">
          <div style="font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px;">Current Rank</div>
          <div th:text="'#' + ${entry.rank}"
               th:style="${entry.rank == 1} ? 'color: #ffd700; font-size: 1.8rem; font-weight: bold; font-family: Oswald;' : 'color: #cbd5e1; font-size: 1.8rem; font-family: Oswald;'">
            #1
          </div>
        </div>

        <a th:href="@{/contest/{id}/leaderboard(id=${entry.fantasyContest.id})}"
           style="background: var(--accent-red); color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-family: 'Oswald'; font-size: 1rem; font-weight: bold; letter-spacing: 1px; transition: 0.2s; box-shadow: 0 4px 10px rgba(177, 17, 17, 0.3);">
          LIVE STANDINGS
        </a>
      </div>
    </div>

    <div class="athlete-list">
      <div th:each="selection : ${entry.selections}" class="athlete-item">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span th:text="${selection.contestSetup?.categoryName ?: 'Event'}">Category</span>
            <strong th:text="${selection.contestant?.name ?: 'Unknown Athlete'}">Athlete Name</strong>
          </div>
          <!-- Score Display - Added null checks -->
          <div style="text-align: right;">
            <span style="color: var(--accent-green); font-size: 0.75rem;">SCORE</span>
            <div th:text="${athleteScores != null and athleteScores.get(selection.contestant.id) != null ? athleteScores.get(selection.contestant.id) : '0.0'}"
                 style="font-family: 'Oswald'; font-size: 1.1rem; color: var(--accent-green);">0.0</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
