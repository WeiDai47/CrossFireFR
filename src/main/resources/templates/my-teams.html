<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Teams - Crossfire Rodeo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-red: #b11111;
      --accent-green: #0bea00;
      --text-light: #f8fafc;
      --border: #334155;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding: 40px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    h1 { font-family: 'Oswald', sans-serif; text-transform: uppercase; color: var(--accent-red); }

    .team-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .contest-info {
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .athlete-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .athlete-item {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .athlete-item strong { color: var(--text-light); }

    .btn-back {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent-green);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <a href="/" class="btn-back">← Back to Lobby</a>

  <h1>My Drafted Teams</h1>
  <p>Viewing entries for: <strong th:text="${searchedUsername}">Username</strong></p>

  <div th:if="${#lists.isEmpty(entries)}">
    <p>No teams found for this username.</p>
  </div>

  <div th:each="entry : ${entries}" class="team-card">
    <div class="contest-info">
      <h2 th:text="${entry.fantasyContest.contestName}" style="margin:0; font-family: 'Oswald';">Contest Name</h2>
      <span style="color: var(--accent-green);" th:text="${entry.fantasyContest.rodeoEvent.eventName}">Rodeo Event</span>
      <span style="margin-left: 15px; color: #94a3b8;" th:text="'Salary: $' + ${#numbers.formatDecimal(entry.totalTeamSalary, 0, 'COMMA', 0, 'POINT')}"></span>
    </div>

    <div class="athlete-list">
      <div th:each="selection : ${entry.selections}" class="athlete-item">
        <span th:text="${selection.contestSetup.categoryName}">Category</span>:
        <strong th:text="${selection.contestant.name}">Athlete Name</strong>
      </div>
    </div>
  </div>
</div>

</body>
</html>
