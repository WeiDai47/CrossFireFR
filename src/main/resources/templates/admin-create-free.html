<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Free Contest | Crossfire Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #b11111; --accent-green: #0bea00; --text-light: #f8fafc; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-light); padding: 40px; }
        .admin-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 40px; max-width: 600px; margin: 0 auto; }
        h1 { font-family: 'Oswald'; text-transform: uppercase; color: var(--accent-green); text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: var(--accent-green); color: black; padding: 15px; border: none; border-radius: 6px; font-family: 'Oswald'; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 20px; }
        .prize-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .rank-tag { background: var(--accent-red); color: white; font-family: 'Oswald'; padding: 5px 10px; border-radius: 4px; min-width: 45px; text-align: center; }
        .btn-add { background: var(--border); color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 0.7rem; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="admin-card">
    <h1>🎁 Launch Free Roll</h1>
    <form th:action="@{/admin/contest/create/free}" method="post">
        <div class="form-group">
            <label>Select Rodeo Event</label>
            <select name="rodeoEventId" required>
                <option th:each="event : ${events}" th:value="${event.id}" th:text="${event.eventName}"></option>
            </select>
        </div>
        <div class="form-group">
            <label>Contest Display Name</label>
            <input type="text" name="contestName" placeholder="e.g. Ford F-150 Giveaway" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Salary Cap ($)</label>
                <input type="number" name="salaryCap" value="50000" required>
            </div>
            <div class="form-group">
                <label>Max Entries per User</label>
                <input type="number" name="maxEntries" value="1" required>
            </div>
        </div>

        <div class="form-group">
            <label>Contest Entry Limit (Total Capacity)</label>
            <input type="number" name="maxTotal" value="1000" required>
        </div>

        <h3 style="color: var(--accent-red); margin-top: 30px;">Item Payouts</h3>
        <div id="prize-container">
            <div class="prize-row">
                <div class="rank-tag">1st</div>
                <input type="text" name="itemPrizes" placeholder="e.g. Brand New Pickup Truck" required>
            </div>
        </div>
        <button type="button" class="btn-add" onclick="addPrize()">+ Add Prize Spot</button>

        <button type="submit" class="btn-submit">Create Free Roll</button>
    </form>
</div>

<script>
    let rank = 1;
    function addPrize() {
        rank++;
        const container = document.getElementById('prize-container');
        const div = document.createElement('div');
        div.className = 'prize-row';
        const suffix = (rank === 2) ? 'nd' : (rank === 3) ? 'rd' : 'th';
        div.innerHTML = `<div class="rank-tag">${rank}${suffix}</div><input type="text" name="itemPrizes" placeholder="e.g. $100 Gift Card">`;
        container.appendChild(div);
    }
</script>
</body>
</html>
