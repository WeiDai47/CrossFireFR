<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bulk Scoring | Crossfire Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #b11111; --accent-green: #0bea00; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; padding: 20px; }
        .spreadsheet-container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--accent-red); }
        h1 { font-family: 'Oswald'; text-transform: uppercase; margin: 0; font-size: 1.5rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; padding: 10px; border-bottom: 1px solid var(--border); }
        td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        input { background: #0f172a; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 4px; width: 100px; }
        input:focus { border-color: var(--accent-green); outline: none; background: #1e293b; }

        .row-modified { background: rgba(11, 234, 0, 0.05); }
        .btn-save-row { background: var(--accent-green); color: black; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; font-weight: bold; opacity: 0.3; pointer-events: none; }
        .active-btn { opacity: 1 !important; pointer-events: auto !important; }

        .status-pill { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; background: #334155; color: #94a3b8; }
    </style>
</head>
<body>

<div class="spreadsheet-container">
    <div class="header-row">
        <h1>Fast-Entry Scoring</h1>
        <select id="eventSelector" onchange="changeEvent(this.value)" style="padding: 10px; background: #0f172a; color: white; border-radius: 6px; border: 1px solid var(--border);">
            <option value="">-- Select Rodeo Event --</option>
            <option th:each="event : ${events}"
                    th:value="${event.id}"
                    th:text="${event.eventName}"
                    th:selected="${event.id == selectedEventId}"></option>
        </select>
    </div>

    <div th:if="${athletes == null}" style="text-align: center; padding: 40px; color: #94a3b8;">
        Please select an event to start scoring.
    </div>

    <table th:if="${athletes != null}">
        <thead>
        <tr>
            <th>Athlete Name</th>
            <th>Category</th>
            <th>Score</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="athlete : ${athletes}" th:id="'row-' + ${athlete.id}">
            <td th:text="${athlete.name}" style="font-weight: 600;"></td>
            <td><span class="status-pill" th:text="${athlete.eventType}"></span></td>
            <td>
                <!-- Input shows existing score from map, or 0.0 if missing -->
                <input type="number" step="0.01"
                       th:id="'score-' + ${athlete.id}"
                       th:value="${currentScores != null ? currentScores.get(athlete.id) : '0.0'}"
                       th:oninput="'markModified(' + ${athlete.id} + ')'"
                       onkeydown="handleKey(event, this)">
            </td>
            <td>
                <button th:id="'btn-' + ${athlete.id}" class="btn-save-row"
                        th:onclick="'submitSingle(' + ${athlete.id} + ')'">SAVE</button>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="margin-top: 20px; text-align: center;">
        <a href="/admin/dashboard" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem;">← Back to Admin</a>
    </div>
</div>

<script>
    function changeEvent(id) {
        if (id) window.location.href = '/admin/scoring?eventId=' + id;
    }

    function markModified(id) {
        document.getElementById('row-' + id).classList.add('row-modified');
        document.getElementById('btn-' + id).classList.add('active-btn');
    }

    async function submitSingle(athleteId) {
        const eventId = document.getElementById('eventSelector').value;
        const score = document.getElementById('score-' + athleteId).value;
        const btn = document.getElementById('btn-' + athleteId);

        const formData = new URLSearchParams();
        formData.append('eventId', eventId);
        formData.append('contestantId', athleteId);
        formData.append('score', score);

        try {
            const response = await fetch('/admin/scoring/update', { method: 'POST', body: formData });
            if (response.ok) {
                document.getElementById('row-' + athleteId).classList.remove('row-modified');
                btn.classList.remove('active-btn');
                btn.innerText = "SAVED";
                setTimeout(() => { btn.innerText = "SAVE"; }, 2000);
            }
        } catch (e) { alert("Error saving score."); }
    }

    // Spreadsheet navigation: Arrow keys move up/down between inputs
    function handleKey(e, input) {
        const row = input.closest('tr');
        if (e.key === "ArrowDown" && row.nextElementSibling) {
            row.nextElementSibling.querySelector('input').focus();
        } else if (e.key === "ArrowUp" && row.previousElementSibling) {
            row.previousElementSibling.querySelector('input').focus();
        } else if (e.key === "Enter") {
            const id = input.id.split('-')[1];
            submitSingle(id);
            if (row.nextElementSibling) row.nextElementSibling.querySelector('input').focus();
        }
    }
</script>

</body>
</html>
