<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="30">
    <title>Live Leaderboard - Crossfire</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 40px; }
        .leaderboard-table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
        .leaderboard-table th, .leaderboard-table td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; }
        .rank-1 { color: #0bea00; font-weight: bold; }
        .username-click { cursor: pointer; color: #cbd5e1; text-decoration: underline dotted; }
        .username-click:hover { color: #0bea00; }



        /* New Prize Style */
        .prize-text { font-family: 'Oswald', sans-serif; font-weight: bold; }
        .prize-cash { color: #0bea00; }
        .prize-item { color: #6366f1; }

        /* The dropdown styles */
        .team-details { display: none; padding: 10px 15px; background: #0f172a; font-size: 0.7rem; color: #94a3b8; border-top: 1px solid #334155; }
        .athlete-mini { display: inline-block; margin-right: 15px; }
        .athlete-mini strong { color: #f8fafc; font-size: 0.8rem; }
    </style>
</head>
<body>
<h1 th:text="${contest.contestName} + ' - LIVE STANDINGS'">Leaderboard</h1>
<p style="color: #ff4444; font-size: 0.8rem;">● LIVE UPDATING (Click name to see team)</p>

<table class="leaderboard-table">
    <thead>
    <tr>
        <th>Rank</th>
        <th>User</th>
        <th>Total Score</th>
        <th style="color: var(--accent-green);">Projected Winnings</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="entry, iter : ${entries}">
        <tr th:classappend="${iter.index == 0} ? 'rank-1'">
            <td th:text="${iter.index + 1}">1</td>
            <td>
                    <span class="username-click" th:text="${entry.username}"
                          th:onclick="'toggleTeam(' + ${entry.id} + ')'">Username</span>
            </td>
            <td th:text="${entry.liveScore}">0.0</td>
            <td>
                <!-- 1. Check for Physical Items (Free Rolls) -->
                <span th:if="${itemPrizes != null and iter.index < itemPrizes.size()}"
                      class="prize-text prize-item" th:text="${itemPrizes[iter.index]}"></span>

                <!-- 2. Check for Cash (Dynamic, GTD, 50/50) -->
                <span th:if="${(itemPrizes == null or itemPrizes.isEmpty()) and livePrizes != null and iter.index < livePrizes.size()}"
                      class="prize-text prize-cash"
                      th:text="'$' + ${#numbers.formatDecimal(livePrizes[iter.index], 1, 'COMMA', 2, 'POINT')}"></span>

                <!-- 3. No prize for this rank -->
                <span th:if="${(itemPrizes == null or iter.index >= itemPrizes.size()) and (livePrizes == null or iter.index >= livePrizes.size())}"
                      style="color: #475569; font-size: 0.8rem;">--</span>
            </td>
        </tr>
    </th:block>
    </tbody>

</table>

<script>
    function toggleTeam(id) {
        const el = document.getElementById('details-' + id);
        el.style.display = (el.style.display === 'table-row') ? 'none' : 'table-row';
    }
</script>
</body>
</html>
