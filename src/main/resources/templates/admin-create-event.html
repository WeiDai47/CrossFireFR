<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Create Rodeo | Crossfire</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #b11111; --accent-green: #0bea00; --text-light: #f8fafc; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-light); padding: 40px; }
        .admin-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 40px; max-width: 500px; margin: 0 auto; }
        h1 { font-family: 'Oswald'; text-transform: uppercase; color: var(--accent-green); text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: var(--accent-red); color: white; padding: 15px; border: none; border-radius: 6px; font-family: 'Oswald'; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="admin-card">
    <h1>Create Rodeo Event</h1>
    <form th:action="@{/admin/event/create}" method="post">
        <div class="form-group">
            <label>Event Name</label>
            <input type="text" name="eventName" placeholder="e.g. NFR Round 1" required>
        </div>
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" placeholder="e.g. Las Vegas, NV" required>
        </div>
        <div class="form-group">
            <label>Event Date</label>
            <input type="date" name="eventDate" required>
        </div>
        <button type="submit" class="btn-submit">Save Event</button>
    </form>
</div>
</body>
</html>
