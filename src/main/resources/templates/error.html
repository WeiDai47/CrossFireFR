<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oops! | Crossfire Rodeo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-red: #b11111; --accent-green: #0bea00; --text-light: #f8fafc; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
        .error-container { max-width: 500px; padding: 40px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .error-code { font-family: 'Oswald'; font-size: 5rem; color: var(--accent-red); margin: 0; line-height: 1; }
        h1 { font-family: 'Oswald'; text-transform: uppercase; margin: 20px 0; color: var(--accent-green); }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }
        .btn-home { display: inline-block; background: var(--accent-red); color: white; text-decoration: none; padding: 12px 30px; font-family: 'Oswald'; text-transform: uppercase; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .btn-home:hover { background: #d41414; transform: translateY(-2px); }
        .logo { font-family: 'Oswald'; color: var(--accent-red); font-size: 1.2rem; margin-bottom: 20px; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="error-container">
    <div class="logo">Crossfire <span style="color:white">Rodeo</span></div>
    <div class="error-code">404</div>
    <h1>Off the Tracks!</h1>
    <p>Looks like this page got bucked off. It either doesn't exist or moved to a different arena.</p>
    <a href="/" class="btn-home">Return to Lobby</a>

    <!-- Hidden developer info for prototype debugging -->
    <div th:if="${status != null}" style="margin-top: 20px; font-size: 0.7rem; color: #334155;">
        Error Status: <span th:text="${status}">500</span> |
        Path: <span th:text="${path}">/unknown</span>
    </div>
</div>
</body>
</html>
