# Give your app a name
spring.application.name=Crossfire

# --- POSTGRESQL CONFIGURATION ---
# Replace the placeholders below with the actual credentials from your host
spring.datasource.url=jdbc:postgresql://your-database-host:5432/your_db_name
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings for Postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# --- SSL / HTTPS Configuration ---
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=crossfire

# Force all traffic to HTTPS
security.require-ssl=true

# Disable H2 Console (not used with Postgres)
spring.h2.console.enabled=false
