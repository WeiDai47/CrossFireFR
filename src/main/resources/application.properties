# Give your app a name
spring.application.name=Crossfire

# Database Configuration (matches the URL you should use in the browser)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Allow the browser-based H2 console to work
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate settings to automatically create the Contestant table
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# SSL / HTTPS Configuration
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=crossfire

# Force all traffic to HTTPS (Optional but recommended)
security.require-ssl=true